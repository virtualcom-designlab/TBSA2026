<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="{{ '/img/TBSAfavif.ico' | relative_url }}">
  <link rel="icon" href="{{ '/img/TBSAfavif48.ico' | relative_url }}" sizes="48x48">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/img/TBSAapple-touch-icon.png' | relative_url }}">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-light.min.css">

  <style>
    body {
      margin: 0;
      background: #ffffff;
    }

    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }

    @media (max-width: 767px) {
      .markdown-body {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="markdown-body">
    {{ content }}
  </main>
</body>
</html>
