<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/img/TBSAfavif.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="48x48" href="{{ '/img/TBSAfavif48.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/img/TBSAapple-touch-icon.png' | relative_url }}">


  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #24292f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    h1, h2, h3 {
      line-height: 1.25;
      margin-top: 1.8em;
      margin-bottom: 0.6em;
      font-weight: 600;
    }

    h1 {
      font-size: 2em;
      border-bottom: 1px solid #d8dee4;
      padding-bottom: 0.3em;
    }

    h2 {
      font-size: 1.5em;
      border-bottom: 1px solid #d8dee4;
      padding-bottom: 0.3em;
    }

    h3 {
      font-size: 1.25em;
    }

    p {
      margin: 0 0 1em;
    }

    a {
      color: #0969da;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    ul, ol {
      padding-left: 2em;
      margin-top: 0;
      margin-bottom: 1em;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    code {
      background: rgba(175, 184, 193, 0.2);
      padding: 0.2em 0.4em;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 85%;
    }

    pre {
      background: #f6f8fa;
      padding: 16px;
      overflow: auto;
      border-radius: 6px;
    }

    pre code {
      background: transparent;
      padding: 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 1em;
    }

    table th,
    table td {
      border: 1px solid #d0d7de;
      padding: 6px 13px;
    }

    table tr:nth-child(2n) {
      background-color: #f6f8fa;
    }

    blockquote {
      color: #57606a;
      border-left: 0.25em solid #d0d7de;
      padding: 0 1em;
      margin: 0 0 1em;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
</head>
<body>
  <main class="markdown-body">
    {{ content }}
  </main>
</body>
</html>
